# Proxy settings shared by the API locations (vhost_backend.conf).
# Install as /etc/nginx/webtile-proxy-headers.conf (outside conf.d: it is
# included inside locations, not at http level).
proxy_http_version 1.1;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Server $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Host $http_host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $webtile_connection_upgrade;
proxy_pass_request_headers on;
