# Server-wide settings for the webtile sites (http level).
# Install as /etc/nginx/conf.d/00-webtile-http.conf, and remove any other
# "gzip on;" from /etc/nginx/nginx.conf (a duplicate is a config error).

# Compression: the frontend's JavaScript goes from ~2.8 MB to ~0.8 MB
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/xml image/svg+xml application/graphql-response+json;

# GraphQL responses cached by the API servers (vhost_backend.conf)
proxy_cache_path /var/cache/nginx/webtile_graphql levels=1:2
                 keys_zone=webtile_graphql:10m max_size=200m inactive=1d
                 use_temp_path=off;

# Never cache mutations (e.g. newsletter subscription) or authenticated
# requests. Any "mutation" word in the body bypasses the cache: a false
# positive only costs a cache miss.
map $request_body $webtile_graphql_mutation {
    default 0;
    "~*\bmutation\b" 1;
}
map $http_authorization $webtile_graphql_authenticated {
    default 1;
    ""      0;
}

# "Connection: upgrade" only for websocket requests, so other connections to
# the backend can be reused
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}
