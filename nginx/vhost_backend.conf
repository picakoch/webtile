# API (Strapi). Needs webtile-http.conf (gzip, GraphQL cache, maps).
# APP_PORT: backend port; UPLOADS_DIR: the site's backend/public/uploads
# directory on the host (e.g. /home/antoine/picasol/backend/public/uploads).
server {
   server_name api.APP_DOMAIN;

   charset utf-8;

   location ~ /.well-known {
        allow all;
   }

   # Uploaded media, straight from disk: no Node in the way, native range
   # requests for audio/video seeking. Strapi gives every upload a unique
   # name, so browsers can keep them for a year.
   location /uploads/ {
        alias UPLOADS_DIR/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Fetched cross-origin by the site (e.g. PDFs rendered with pdf.js)
        add_header Access-Control-Allow-Origin *;
        access_log off;
   }

   # GraphQL: identical queries are answered from a 60 s cache. When it
   # expires, visitors still get the cached copy while nginx refreshes it in
   # the background, so content edits show up within about a minute.
   location = /graphql {
        # Not a small POST (see webtile-http.conf): straight to Strapi
        error_page 418 = @graphql_direct;
        if ($webtile_graphql_direct) {
            return 418;
        }

        proxy_pass http://localhost:APP_PORT;
        include /etc/nginx/webtile-proxy-headers.conf;

        client_body_buffer_size 16k;   # keep the body in memory: it's the cache key
        proxy_buffer_size 16k;         # ...and the key must fit here
        proxy_buffers 8 16k;
        proxy_cache webtile_graphql;
        proxy_cache_methods POST;
        proxy_cache_key "$host|$request_body";
        proxy_cache_valid 200 60s;
        # Strapi sends "Cache-Control: no-store"; for nginx's own cache only
        # (browsers still get no-store). Responses setting cookies are still
        # never cached.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_bypass $webtile_graphql_mutation $webtile_graphql_authenticated;
        proxy_no_cache     $webtile_graphql_mutation $webtile_graphql_authenticated;
        add_header X-Cache-Status $upstream_cache_status always;
   }

   location @graphql_direct {
        proxy_pass http://localhost:APP_PORT;
        include /etc/nginx/webtile-proxy-headers.conf;
   }

   location / {
        proxy_pass http://localhost:APP_PORT/;
        include /etc/nginx/webtile-proxy-headers.conf;
   }

   listen 80;

}
