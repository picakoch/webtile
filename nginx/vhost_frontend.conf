server {
    server_name  APP_DOMAIN www.APP_DOMAIN;

    root   /usr/share/nginx/html/app_name;
    index  index.html;

    # robots.txt, sitemap.xml and each page's <head> tags (title, description,
    # canonical, Open Graph) come from the API (backend/src/api/seo), which
    # builds absolute URLs from these two headers. APP_PORT: the backend port.

    location = /robots.txt {
        proxy_pass http://127.0.0.1:APP_PORT/api/seo/robots.txt;
        proxy_set_header X-Site-Origin https://APP_DOMAIN;
        proxy_set_header X-Api-Origin https://api.APP_DOMAIN;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:APP_PORT/api/seo/sitemap.xml;
        proxy_set_header X-Site-Origin https://APP_DOMAIN;
        proxy_set_header X-Api-Origin https://api.APP_DOMAIN;
    }

    # Included by index.html: <!--# include virtual="/__head$request_uri" -->
    # so link previews (Facebook, WhatsApp, Slack...) work without JavaScript
    location ~ ^/__head(?<head_path>/.*)$ {
        internal;
        proxy_pass http://127.0.0.1:APP_PORT/api/seo/head?path=$head_path;
        proxy_set_header X-Site-Origin https://APP_DOMAIN;
        proxy_set_header X-Api-Origin https://api.APP_DOMAIN;
        # API down or failing: include nothing (not nginx's error page)
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @no_head;
    }

    location @no_head {
        return 204;
    }

    # Build output with hashed names: safe to cache for a long time
    # (^~: takes priority over the static files rule below)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static files. A missing one is a 404, not the app's index.html:
    # a browser with an old page cached would otherwise get HTML for the old
    # page's .js/.css ("expected expression, got '<'")
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|eot|txt|xml|webmanifest)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        # Always revalidate the page itself, so a deploy is picked up at once
        add_header Cache-Control "no-cache";
        ssi on;
        # If the API is down, pages still load, without these tags
        ssi_silent_errors on;
        try_files $uri $uri/ /index.html;
    }

    listen 80;

}
